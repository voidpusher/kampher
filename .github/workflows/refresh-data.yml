name: Near-real-time production refresh

on:
  schedule:
    # Public feeds: every 15 minutes. GitHub schedules can occasionally be delayed.
    - cron: "*/15 * * * *"
    # Stack Overflow: every two hours to stay below its anonymous 300 req/day quota.
    - cron: "7 */2 * * *"
    # Bounded intelligence pass every six hours so the public feed stays useful.
    - cron: "40 */6 * * *"
    # Daily read-only disaster-recovery readiness check.
    - cron: "20 3 * * *"
  workflow_dispatch:

concurrency:
  group: kampher-production-refresh
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  fast-source-refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      KAMPHER_ENV: prod
      KAMPHER_DATABASE_URL: ${{ secrets.KAMPHER_DATABASE_URL }}
      KAMPHER_DATABASE_URL_SYNC: ${{ secrets.KAMPHER_DATABASE_URL_SYNC }}
      KAMPHER_QDRANT_URL: ${{ secrets.KAMPHER_QDRANT_URL }}
      KAMPHER_QDRANT_API_KEY: ${{ secrets.KAMPHER_QDRANT_API_KEY }}
      KAMPHER_REDDIT_CLIENT_ID: ${{ secrets.KAMPHER_REDDIT_CLIENT_ID }}
      KAMPHER_REDDIT_CLIENT_SECRET: ${{ secrets.KAMPHER_REDDIT_CLIENT_SECRET }}
      KAMPHER_REDDIT_USER_AGENT: kampher/0.1 (production collector)
      KAMPHER_GITHUB_TOKEN: ${{ github.token }}
      KAMPHER_GITHUB_REPOS: '["vercel/next.js","supabase/supabase","langchain-ai/langchain","fastapi/fastapi","docker/compose","prisma/prisma","microsoft/playwright","stripe/stripe-node"]'
      KAMPHER_GITHUB_DISCUSSIONS_ENABLED: "false"
      KAMPHER_QDRANT_PATH: ""
      KAMPHER_STACKOVERFLOW_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        run: uv sync --frozen --no-dev
      - name: Apply database migrations
        run: uv run alembic upgrade head
      - name: Sync official tech polls
        run: uv run python -m app.db.seed_tech_polls
      - name: Collect and index only new conversations
        run: uv run python -m app.workers.run_once refresh
      - name: Verify public-feed freshness
        run: uv run python -m app.workers.run_once monitor 60
      - name: Open a public-feed ingestion alert
        if: ${{ failure() }}
        uses: actions/github-script@v9
        env:
          ALERT_TITLE: "Kampher alert: public-feed ingestion is failing"
          ALERT_GROUP: "GitHub Issues, Hacker News, Dev.to, Lobsters, and configured credentialed feeds"
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = process.env.ALERT_TITLE;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (!existing) {
              const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
              await github.rest.issues.create({
                owner,
                repo,
                title,
                assignees: [owner],
                body: [
                  "Kampher's automated ingestion monitor detected a failed or stale source stream.",
                  "",
                  `**Source group:** ${process.env.ALERT_GROUP}`,
                  `**Failed workflow:** ${runUrl}`,
                  "",
                  "The issue will close automatically after the next successful refresh."
                ].join("\n")
              });
            }
      - name: Close recovered public-feed alert
        if: ${{ success() }}
        uses: actions/github-script@v9
        env:
          ALERT_TITLE: "Kampher alert: public-feed ingestion is failing"
        with:
          script: |
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const existing = issues.find(
              issue => !issue.pull_request && issue.title === process.env.ALERT_TITLE
            );
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: "closed"
              });
            }

  stackoverflow-refresh:
    if: github.event.schedule == '7 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      KAMPHER_ENV: prod
      KAMPHER_DATABASE_URL: ${{ secrets.KAMPHER_DATABASE_URL }}
      KAMPHER_DATABASE_URL_SYNC: ${{ secrets.KAMPHER_DATABASE_URL_SYNC }}
      KAMPHER_QDRANT_URL: ${{ secrets.KAMPHER_QDRANT_URL }}
      KAMPHER_QDRANT_API_KEY: ${{ secrets.KAMPHER_QDRANT_API_KEY }}
      KAMPHER_QDRANT_PATH: ""
      KAMPHER_HN_ENABLED: "false"
      KAMPHER_DEVTO_ENABLED: "false"
      KAMPHER_LOBSTERS_ENABLED: "false"
      KAMPHER_STACKOVERFLOW_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        run: uv sync --frozen --no-dev
      - name: Apply database migrations
        run: uv run alembic upgrade head
      - name: Collect and index only new Stack Overflow posts
        run: uv run python -m app.workers.run_once refresh
      - name: Verify Stack Overflow freshness
        run: uv run python -m app.workers.run_once monitor 180
      - name: Open a Stack Overflow ingestion alert
        if: ${{ failure() }}
        uses: actions/github-script@v9
        env:
          ALERT_TITLE: "Kampher alert: Stack Overflow ingestion is failing"
          ALERT_GROUP: "Stack Overflow"
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = process.env.ALERT_TITLE;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (!existing) {
              const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
              await github.rest.issues.create({
                owner,
                repo,
                title,
                assignees: [owner],
                body: [
                  "Kampher's automated ingestion monitor detected a failed or stale source stream.",
                  "",
                  `**Source group:** ${process.env.ALERT_GROUP}`,
                  `**Failed workflow:** ${runUrl}`,
                  "",
                  "The issue will close automatically after the next successful refresh."
                ].join("\n")
              });
            }
      - name: Close recovered Stack Overflow alert
        if: ${{ success() }}
        uses: actions/github-script@v9
        env:
          ALERT_TITLE: "Kampher alert: Stack Overflow ingestion is failing"
        with:
          script: |
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const existing = issues.find(
              issue => !issue.pull_request && issue.title === process.env.ALERT_TITLE
            );
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: "closed"
              });
            }

  recovery-readiness:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      KAMPHER_ENV: prod
      KAMPHER_DATABASE_URL: ${{ secrets.KAMPHER_DATABASE_URL }}
      KAMPHER_DATABASE_URL_SYNC: ${{ secrets.KAMPHER_DATABASE_URL_SYNC }}

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        run: uv sync --frozen --no-dev
      - name: Verify production recovery invariants
        run: uv run python -m app.workers.run_once recovery
      - name: Open a recovery-readiness alert
        if: ${{ failure() }}
        uses: actions/github-script@v9
        env:
          ALERT_TITLE: "Kampher alert: database recovery readiness failed"
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = process.env.ALERT_TITLE;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (!existing) {
              const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
              await github.rest.issues.create({
                owner,
                repo,
                title,
                assignees: [owner],
                body: [
                  "Kampher's daily recovery-readiness check failed.",
                  "",
                  `**Failed workflow:** ${runUrl}`,
                  "",
                  "Check the database schema, corpus, taxonomy, freshness, and source errors.",
                  "Follow `docs/RECOVERY.md` before performing any restore."
                ].join("\n")
              });
            }
      - name: Close recovered database alert
        if: ${{ success() }}
        uses: actions/github-script@v9
        env:
          ALERT_TITLE: "Kampher alert: database recovery readiness failed"
        with:
          script: |
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const existing = issues.find(
              issue => !issue.pull_request && issue.title === process.env.ALERT_TITLE
            );
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: "closed"
              });
            }

  intelligence-refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '40 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      KAMPHER_ENV: prod
      KAMPHER_DATABASE_URL: ${{ secrets.KAMPHER_DATABASE_URL }}
      KAMPHER_DATABASE_URL_SYNC: ${{ secrets.KAMPHER_DATABASE_URL_SYNC }}
      KAMPHER_QDRANT_URL: ${{ secrets.KAMPHER_QDRANT_URL }}
      KAMPHER_QDRANT_API_KEY: ${{ secrets.KAMPHER_QDRANT_API_KEY }}
      KAMPHER_QDRANT_PATH: ""
      KAMPHER_LLM_PROVIDER: gemini
      KAMPHER_LLM_MODEL: gemini-3.5-flash
      KAMPHER_LLM_MODEL_FAST: gemini-3.1-flash-lite
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Check intelligence configuration
        id: intelligence
        shell: bash
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add GEMINI_API_KEY to enable the intelligence pipeline."
          fi
      - name: Install backend dependencies
        if: steps.intelligence.outputs.enabled == 'true'
        run: uv sync --frozen --no-dev
      - name: Apply database migrations
        if: steps.intelligence.outputs.enabled == 'true'
        run: uv run alembic upgrade head
      - name: Enrich a bounded, failure-isolated batch
        if: steps.intelligence.outputs.enabled == 'true'
        run: uv run python -m app.workers.run_once enrich 25
      - name: Cluster pain and publish eligible opportunities
        if: steps.intelligence.outputs.enabled == 'true'
        run: uv run python -m app.workers.run_once cluster
      - name: Write trend snapshots
        if: steps.intelligence.outputs.enabled == 'true'
        run: uv run python -m app.workers.run_once trends
